<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הצטרפות לרשימת התוכן</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    .box {
      background: white;
      padding: 50px 60px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: center;
      width: 100%;
      max-width: 480px;
    }
    h1 { color: #333; margin-bottom: 30px; }
    .field {
      margin-bottom: 20px;
      text-align: right;
    }
    .field label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .field input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }
    input[type="submit"] {
      margin-top: 10px;
      width: 100%;
      padding: 14px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    input[type="submit"]:hover {
      background: #357abd;
    }
  </style>
</head>
<body>
<div class="box">
  <h1>הצטרפות לרשימת התוכן</h1>
  <script type="text/javascript">
  function responder_validation(form) {
    var inputs = form.getElementsByTagName('input');
    var filter_email = /^([\w\!\#$\%\&\'\*\+\-\/\=\?\^\`{\|\}\~]+\.)*[\w\!\#$\%\&\'\*\+\-\/\=\?\^\`{\|\}\~]+@((((([a-z0-9]{1}[a-z0-9\-]{0,62}[a-z0-9]{1})|[a-z0-9])\.)+[a-z]{2,})|(\d{1,3}\.){3}\d{1,3}(\:\d{1,5})?)$/i;
    for (var a=0; a<inputs.length; a++) {
      switch (inputs[a].name) {
        case 'fields[subscribers_email]':
          if (!filter_email.test(inputs[a].value)) {
            alert('כתובת הדוא"ל אינה חוקית');
            inputs[a].focus();
            return false;
          }
          break;
        case 'fields[subscribers_name]':
          if (inputs[a].value.replace(/^\s+|\s+$/g, '')=='') {
            alert('נא לרשום שם');
            inputs[a].focus();
            return false;
          }
          break;
      }
    }
    if (document.charset) form.encoding.value = document.charset;
    else if (document.characterSet) form.encoding.value = document.characterSet;
    if (navigator.userAgent.indexOf(';FBAV/') > -1 || navigator.userAgent.indexOf('Instagram') > -1) {
      form.target = '_self';
    }
    return true;
  }
  </script>
  <form method="post" action="https://subscribe.responder.co.il" onsubmit="return responder_validation(this);">
    <div class="field">
      <label>דואר אלקטרוני <span style="color:red;">*</span></label>
      <input type="text" name="fields[subscribers_email]" dir="ltr" />
    </div>
    <div class="field">
      <label>שם <span style="color:red;">*</span></label>
      <input type="text" name="fields[subscribers_name]" dir="rtl" />
    </div>
    <input type="hidden" name="form_id" value="2877979" />
    <input type="hidden" name="encoding" value="" />
    <input type="submit" value="אשמח להיות שותפה לפינה" />
  </form>
</div>
</body>
</html>
